<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Discover LEGO Architecture sets inspired by iconic landmarks around the world."
    />
    <title>BrickArch | Build somewhere remarkable</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --ink: #153b3a;
        --muted: #55706c;
        --paper: #f4f7ef;
        --white: #fffefa;
        --orange: #f15c38;
        --yellow: #f2db58;
        --line: #d9e1d8;
        --display: "Barlow Condensed", Impact, sans-serif;
        --body: "DM Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: flex;
        flex-direction: column;
        color: var(--ink);
        background: var(--paper);
        font-family: var(--body);
      }

      a {
        color: inherit;
      }

      .site-header {
        position: sticky;
        z-index: 5;
        top: 0;
        display: flex;
        min-height: 82px;
        align-items: center;
        justify-content: space-between;
        gap: 28px;
        padding: 16px clamp(22px, 6vw, 92px);
        border-bottom: 1px solid var(--line);
        background: rgb(244 247 239 / 94%);
        backdrop-filter: blur(14px);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--ink);
        font-size: 23px;
        font-weight: 700;
        letter-spacing: 0;
        text-decoration: none;
      }

      .brand-mark {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border-radius: 50%;
        color: var(--white);
        background: var(--orange);
        font-family: var(--display);
        font-size: 19px;
        line-height: 1;
      }

      .search-form {
        display: flex;
        width: min(100%, 390px);
        min-height: 44px;
        align-items: center;
        gap: 8px;
        padding: 4px 5px 4px 15px;
        border: 1px solid #c9d5cb;
        border-radius: 3px;
        background: var(--white);
      }

      .search-form:focus-within {
        outline: 2px solid var(--orange);
        outline-offset: 2px;
      }

      .search-form input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: 0;
        color: var(--ink);
        background: transparent;
        font: 500 14px var(--body);
      }

      .search-form input::placeholder {
        color: #758681;
      }

      .search-form button {
        flex: 0 0 auto;
        min-height: 34px;
        padding: 0 13px;
        border: 0;
        border-radius: 2px;
        color: var(--white);
        background: var(--ink);
        cursor: pointer;
        font: 600 13px var(--body);
      }

      .search-form button:hover {
        background: var(--orange);
      }

      main {
        display: grid;
        width: min(100% - 44px, 1280px);
        flex: 1;
        grid-template-columns: minmax(0, 1.08fr) minmax(320px, 0.92fr);
        align-items: center;
        gap: clamp(36px, 7vw, 96px);
        margin: 0 auto;
        padding: clamp(48px, 8vh, 88px) 0;
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        animation: arrive 650ms ease-out both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 1.4px;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 22px;
        height: 3px;
        background: var(--orange);
        content: "";
      }

      h1 {
        max-width: 730px;
        margin: 0;
        font-family: var(--display);
        font-size: clamp(58px, 7.1vw, 100px);
        font-weight: 800;
        letter-spacing: 0;
        line-height: 0.91;
        text-wrap: balance;
      }

      h1 span {
        color: var(--orange);
      }

      .hero-note {
        max-width: 410px;
        margin: 24px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.65;
      }

      .explore-link {
        display: inline-flex;
        min-height: 48px;
        align-items: center;
        gap: 20px;
        margin-top: 28px;
        padding: 0 17px;
        border-radius: 2px;
        color: var(--white);
        background: var(--ink);
        font-size: 14px;
        font-weight: 700;
        text-decoration: none;
        transition: background 160ms ease, transform 160ms ease;
      }

      .explore-link:hover {
        transform: translateY(-2px);
        background: var(--orange);
      }

      .explore-link span {
        font-size: 19px;
        line-height: 1;
      }

      .hero-art {
        position: relative;
        min-width: 0;
        animation: arrive 750ms 100ms ease-out both;
      }

      .image-frame {
        position: relative;
        aspect-ratio: 0.88;
        overflow: hidden;
        background: var(--yellow);
      }

      .image-frame::before {
        position: absolute;
        z-index: 1;
        inset: 0;
        border: 1px solid rgb(21 59 58 / 12%);
        content: "";
        pointer-events: none;
      }

      .image-frame img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
      }

      .image-caption {
        position: absolute;
        right: -13px;
        bottom: 22px;
        display: flex;
        max-width: calc(100% - 14px);
        align-items: center;
        gap: 12px;
        padding: 13px 17px;
        color: var(--ink);
        background: var(--yellow);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
      }

      .image-caption::before {
        width: 7px;
        height: 7px;
        flex: 0 0 7px;
        border-radius: 50%;
        background: var(--orange);
        content: "";
      }

      .site-footer {
        display: flex;
        min-height: 62px;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 16px clamp(22px, 6vw, 92px);
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 12px;
      }

      .footer-note {
        color: var(--ink);
        font-weight: 600;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(14px);
        }

        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (min-width: 1500px) {
        h1 {
          font-size: 104px;
        }
      }

      @media (max-width: 760px) {
        .site-header {
          min-height: 72px;
          gap: 16px;
          padding-inline: 20px;
        }

        .brand {
          gap: 8px;
          font-size: 20px;
        }

        .brand-mark {
          width: 27px;
          height: 27px;
          font-size: 17px;
        }

        .search-form {
          width: min(58%, 320px);
          min-height: 40px;
          padding-left: 10px;
        }

        .search-form input {
          font-size: 12px;
        }

        .search-form button {
          min-height: 30px;
          padding-inline: 9px;
          font-size: 12px;
        }

        main {
          width: min(100% - 40px, 560px);
          grid-template-columns: 1fr;
          gap: 42px;
          padding-block: 60px 54px;
        }

        h1 {
          max-width: 560px;
          font-size: clamp(58px, 12vw, 84px);
        }

        .hero-note {
          margin-top: 19px;
          font-size: 15px;
        }

        .hero-art {
          width: min(100%, 430px);
          justify-self: center;
        }

        .image-frame {
          aspect-ratio: 1.1;
        }

        .image-caption {
          right: -7px;
        }

        .site-footer {
          padding-inline: 20px;
        }
      }

      @media (max-width: 410px) {
        .site-header {
          gap: 10px;
          padding-inline: 14px;
        }

        .brand {
          font-size: 18px;
        }

        .brand-mark {
          width: 24px;
          height: 24px;
          font-size: 16px;
        }

        .search-form {
          width: 57%;
        }

        .search-form input::placeholder {
          color: transparent;
        }

        main {
          width: calc(100% - 32px);
          padding-top: 48px;
        }

        h1 {
          font-size: 56px;
        }

        .site-footer {
          align-items: flex-start;
          flex-direction: column;
          gap: 6px;
          padding-block: 14px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#home" aria-label="BrickArch home">
        <span class="brand-mark" aria-hidden="true">B</span>
        BrickArch
      </a>
      <form
        class="search-form"
        action="https://www.lego.com/en-us/search"
        method="get"
        role="search"
        aria-label="Search LEGO sets"
      >
        <input
          type="search"
          name="q"
          placeholder="Search landmarks or sets"
          aria-label="Search landmarks or sets"
          required
        />
        <button type="submit">Search</button>
      </form>
    </header>

    <main id="home">
      <section class="hero-copy" aria-labelledby="hero-title">
        <p class="eyebrow">A world of architecture, brick by brick</p>
        <h1 id="hero-title">
          Explore great LEGO landmarks and architecture sets around the world.
          <!-- You can find here amazing LEGO sets of architecture landmarks around the globe in -->
          <!-- <span>affordable price</span> -->
        </h1>
        <p class="hero-note">
          Find a little piece of the places you love, ready to build and display.
        </p>
        <a class="explore-link" href="products.html" aria-label="Explore LEGO Models">
          Explore LEGO Models <span aria-hidden="true">→</span>
        </a>
      </section>

      <div class="hero-art">
        <div class="image-frame">
          <img
            src="https://images.unsplash.com/photo-1587654780291-39c9404d746b?auto=format&fit=crop&w=1100&q=85"
            alt="Colorful LEGO bricks ready to become a miniature landmark"
            fetchpriority="high"
          />
        </div>
        <div class="image-caption">Build your next destination</div>
      </div>
    </main>

    <footer class="site-footer">
      <span>All rights reserved <span id="year"></span></span>
      <span class="footer-note">Made for curious builders.</span>
    </footer>

    <script>
      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
